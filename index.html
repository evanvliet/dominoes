function gameYear(game){
  const rawDate = game.date || game.time;
  if(!rawDate) return null;
  const date = normalizeGameDate(rawDate).date;
  const match = String(date).match(/^(\d{4})-/);
  return match ? Number(match[1]) : null;
}

function getStatsYears(games){
  return [...new Set(games.map(gameYear).filter(year => year !== null))].sort((a,b) => a-b);
}

function moveStatsYear(direction){
  stopStatsYearAnimation();
  const years = getStatsYears(S.pastGames || []);
  if(!years.length) return;
  const current = S.statsYear === 'all' ? -1 : years.indexOf(Number(S.statsYear));
  if(current < 0) {
    S.statsYear = direction > 0 ? years[0] : years[years.length - 1];
  } else if(direction > 0) {
    S.statsYear = current === years.length - 1 ? 'all' : years[current + 1];
  } else {
    S.statsYear = current === 0 ? 'all' : years[current - 1];
  }
  S.statsYearError = '';
  save();
  render();
}

function stopStatsYearAnimation(){
  if(statsYearAnimationTimer!==null){
    clearInterval(statsYearAnimationTimer);
    statsYearAnimationTimer=null;
  }
}

function startStatsYearAnimation(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  stopStatsYearAnimation();
  const years=getStatsYears(S.pastGames || []);
  if(years.length<3 || S.tab!==1) return;
  if(S.statsYear==='all' || !years.includes(Number(S.statsYear))){
    S.statsYear=years[0];
    S.statsYearError='';
    save();
    render();
  }
  const currentIndex=years.indexOf(Number(S.statsYear));
  if(currentIndex<0 || currentIndex===years.length-1) return;
  statsYearAnimationTimer=setInterval(()=>{
    const index=years.indexOf(Number(S.statsYear));
    if(index<0 || index>=years.length-1){
      stopStatsYearAnimation();
      return;
    }
    S.statsYear=years[index+1];
    S.statsYearError='';
    save();
    render();
    if(index+1===years.length-1) stopStatsYearAnimation();
  },1000);
}

function setStatsYear(value){
  stopStatsYearAnimation();
  if(value === '') {
    S.statsYear = 'all';
    S.statsYearError = '';
    save();
    render();
    return;
  }
  const year = Number(value);
  if(!Number.isInteger(year) || !getStatsYears(S.pastGames || []).includes(year)) {
    S.statsYearError = 'Choose a year with recorded games.';
    render();
    return;
  }
  S.statsYear = year;
  S.statsYearError = '';
  save();
  render();
}

function render(){
  const appEl = document.getElementById('app');
  if (!appEl) return;
  const existingScoresHistory = appEl.querySelector('.stats-scores-history');
  const existingScoresHistoryScrollTop = existingScoresHistory ? existingScoresHistory.scrollTop : null;
  const activeId = document.activeElement ? document.activeElement.id : null;
  if(S.status && S.statusUntil && Date.now()>S.statusUntil){S.status='';S.statusUntil=0;save();}
  const tabIcons=[
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 12h16"/><path d="M12 4v16"/></svg>`,
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a4 4 0 014 4 4 4 0 01-8 0 4 4 0 014-4z"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>`
  ];
  const tabNames=['Score','Stats','Options'];
  const hasContests = Object.keys(S.contests).length > 0;
  const contestActive = (S.names[0] || S.names[1]) && hasContests;
  
  const tabbar=tabNames.map((n,i)=>{
    const unavailable = (i === 0 || i === 1) && !contestActive;
    return `<div class="tbtab ${S.tab===i?'active':''} ${unavailable?'disabled':''}" onclick="${unavailable?'':'setTab('+i+')'}">${tabIcons[i]}<span>${n}</span></div>`;
  }).join('');
  
  let defaultStartStatus = '';
  const activeHelpMessage = S.helpTab === S.tab ? S.helpMessage : '';
  const controlsDisabled = waitingForHighDouble() || S.phase === 'start';
  const statusText = S.status || (S.tab === 0 ? S.gameEndMessage : '') || activeHelpMessage || defaultStartStatus;
  const isNewContestHelp = !S.status && !activeHelpMessage && defaultStartStatus === 'Add player names and press Add.';
  const statusIcon = (S.tab === 0 && waitingForHighDouble()) || S.status || activeHelpMessage || (S.tab === 0 && S.gameEndMessage) ? '&#10003;' : '?';
  const statusClick = (S.tab === 0 && S.phase === 'start' && !S.status && !activeHelpMessage) ? 'showHelp()' : ((S.tab === 0 && waitingForHighDouble()) || S.status || activeHelpMessage || (S.tab === 0 && S.gameEndMessage) ? 'ackStatus()' : (isNewContestHelp ? 'S.hideNewContestHelp=true;render()' : 'showHelp()'));
  
  const activeRecentScores = S.records.filter(r => r.type === 'score').slice(-4);
  const recentScores = activeRecentScores.length ? activeRecentScores : (S.lastGameRecentScores || []);
  const showHistory = !S.status && !activeHelpMessage && (S.tab !== 0 || !S.gameEndMessage) && recentScores.length > 0;

  // Targeted DOM update for Tab 0 if already mounted
  const isTab0Mounted = S.tab === 0 && appEl.dataset.tab === '0' && appEl.querySelector('.scoreboard');
  if (isTab0Mounted) {
    const isStart = S.phase === 'start';
    const highlightPlayers = S.phase === 'start' || waitingForHighDouble();

    // 1. Display bar
    const displayEl = document.getElementById('display-bar');
    if (displayEl) {
      displayEl.textContent = S.display || '0';
      displayEl.className = 'display-bar' + (S.display ? '' : ' dim');
    }

    // 2. Keypad
    const keypadKeys = appEl.querySelectorAll('.keypad .key');
    keypadKeys.forEach(k => {
      if (k.classList.contains('domino-key')) {
        k.innerHTML = domTile();
        if (controlsDisabled) k.classList.add('disabled');
        else k.classList.remove('disabled');
      } else {
        if (controlsDisabled) k.classList.add('disabled');
        else k.classList.remove('disabled');
      }
    });

    // 3. Scoreboard Cards
    const scards = appEl.querySelectorAll('.scoreboard .scard');
    [0, 1].forEach(i => {
      const sc = scards[i];
      if (sc) {
        sc.className = `scard ${highlightPlayers ? 'select-starter' : ''}`;
        const pname = sc.querySelector('.pname');
        const scoreTot = sc.querySelector('.score-total');
        if (pname && pname.textContent !== S.names[i]) pname.textContent = S.names[i];
        const val = String(END_SCORE_HOLD ? END_SCORE_HOLD[i] : (isStart ? 0 : S.scores[i]));
        if (scoreTot && scoreTot.textContent !== val) scoreTot.textContent = val;
      }
    });

    // 4. Status Bar
    const statusBar = appEl.querySelector('.status-bar');
    const statusTextEl = appEl.querySelector('.status-bar .status-text');
    const statusIconEl = appEl.querySelector('.status-bar .status-icon');
    if (statusBar) statusBar.setAttribute('onclick', statusClick);
    if (statusIconEl) statusIconEl.innerHTML = statusIcon;
    
    if (statusTextEl) {
      if (statusText) {
        statusTextEl.innerHTML = escapeHTML(statusText).replace(/\n/g, '<br/>');
        statusTextEl.classList.remove('empty');
      } else if (showHistory) {
        statusTextEl.classList.remove('empty');
        patchMiniHistory(recentScores);
      } else {
        statusTextEl.innerHTML = defaultStartStatus ? escapeHTML(defaultStartStatus) : '&nbsp;';
        if (!defaultStartStatus) statusTextEl.classList.add('empty');
        else statusTextEl.classList.remove('empty');
      }
    }

    // 5. Tabbar
    const tabbarEl = appEl.querySelector('.tabbar');
    if (tabbarEl) tabbarEl.innerHTML = tabbar;
    return;
  }

  appEl.dataset.tab = String(S.tab);
  let content = '';
  if(S.tab===0){
    const isStart=S.phase==='start';
    const highlightPlayers = S.phase === 'start' || waitingForHighDouble();
    const displayClass=S.display?'display-bar':'display-bar dim';
    const cards=[0,1].map(i=>`
      <div class="scard ${highlightPlayers?'select-starter':''}" onclick="tapPlayer(${i})">
        <div class="pname">${escapeHTML(S.names[i])}</div>
        <div class="score-total">${END_SCORE_HOLD ? END_SCORE_HOLD[i] : (isStart ? 0 : S.scores[i])}</div>
      </div>`).join('');
    const dominoLabel=domTile();

    const statusInner = statusText 
      ? escapeHTML(statusText).replace(/\n/g, '<br/>') 
      : (showHistory ? '<div class="hist-mini"></div>' : (defaultStartStatus ? escapeHTML(defaultStartStatus) : '&nbsp;'));

    content=`
      <div class="numpad-wrap">
        <div id="display-bar" class="${displayClass}">${S.display||'0'}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key ${controlsDisabled?'disabled':''}" onclick="pressKey('${n}')">${n}</div>`).join('')}
          <div class="key del ${controlsDisabled?'disabled':''}" onclick="delKey()">&#9003;</div>
          <div class="key ${controlsDisabled?'disabled':''}" onclick="pressKey('0')">0</div>
          <div class="key domino-key ${controlsDisabled?'disabled':''}" onclick="callDomino(event)">${dominoLabel}</div>
        </div>
      </div>
      <div class="scoreboard">${cards}</div>
      <div class="status-bar score-status" onclick="${statusClick}">
        <div class="status-text ${(!statusText && !showHistory && !defaultStartStatus) ? 'empty' : ''}">
          ${statusInner}
        </div>
        <div class="status-icon">${statusIcon}</div>
      </div>
    `;
  } else if(S.tab===1){
    const allGames = S.pastGames || [];
    const statsYears = getStatsYears(allGames);
    if(statsYears.length < 3) {
        stopStatsYearAnimation();
      S.statsYear = 'all';
      S.statsYearError = '';
    }
    if(S.statsYear !== 'all' && !statsYears.includes(Number(S.statsYear))) {
      S.statsYear = 'all';
      S.statsYearError = '';
    }
    const games = S.statsYear === 'all'
      ? allGames
      : allGames.filter(game => gameYear(game) === Number(S.statsYear));
    const orderedGames = games.slice().sort((a,b) => gameKey(a).localeCompare(gameKey(b)));
    const totalGames = games.length;
    const wins = [0, 0];
    const totals = [0, 0];
    const margins = [];
    const hostMargins = [];
    const guestMargins = [];

    games.forEach(g => {
      const winnerIdx = gameWinnerIdx(g);
      const scores = gameScores(g);
      wins[winnerIdx]++;
      totals[0] += scores[0];
      totals[1] += scores[1];
      const diff = Math.abs(scores[0] - scores[1]);
      margins.push(diff);
      if (winnerIdx === 0) hostMargins.push(diff);
      else guestMargins.push(diff);
    });

    const p1Name = escapeHTML(S.names[0]) || 'Host';
    const p2Name = escapeHTML(S.names[1]) || 'Guest';

    const avg = [
      totalGames ? (totals[0] / totalGames).toFixed(1) : '0.0',
      totalGames ? (totals[1] / totalGames).toFixed(1) : '0.0'
    ];

    const box1Titles = ['GAMES WON', 'AVERAGE POINTS PER GAME', 'TOTAL POINTS'];
    const box1Data = [
      [wins[0], wins[1]],
      [avg[0], avg[1]],
      [totals[0], totals[1]]
    ];

    const box2Titles = ['CUMULATIVE GAMES WON', 'CUMULATIVE POINTS'];

    const cumulativeWinsHost = [];
    const cumulativeWinsGuest = [];
    const cumulativePointsHost = [];
    const cumulativePointsGuest = [];
    let runningWinsHost = 0;
    let runningWinsGuest = 0;
    let runningPointsHost = 0;
    let runningPointsGuest = 0;
    orderedGames.forEach(g => {
      const scores = gameScores(g);
      if (gameWinnerIdx(g) === 0) runningWinsHost++;
      else runningWinsGuest++;
      cumulativeWinsHost.push(runningWinsHost);
      cumulativeWinsGuest.push(runningWinsGuest);
      runningPointsHost += scores[0];
      runningPointsGuest += scores[1];
      cumulativePointsHost.push(runningPointsHost);
      cumulativePointsGuest.push(runningPointsGuest);
    });

    const makeLinePath = (points, opts={}) => {
      if (!points.length) return '';
      const width = opts.width || 320;
      const height = opts.height || 70;
      const padding = opts.padding || 16;
      const minVal = Math.min(...points, 0);
      const maxVal = Math.max(...points, 0);
      const range = maxVal - minVal || 1;
      const step = points.length > 1 ? (width - padding * 2) / (points.length - 1) : 0;
      const mapped = points.map((value, index) => {
        const x = padding + step * index;
        const y = height - padding - ((value - minVal) / range) * (height - padding * 2);
        return { x, y };
      });
      if (mapped.length === 1) {
        const point = mapped[0];
        return `M ${point.x} ${point.y} L ${point.x} ${point.y}`;
      }
      return `M ${mapped.map(point => `${point.x} ${point.y}`).join(' L ')}`;
    };

    // Prepare single-line lead series for games or points (host minus guest)
    const gameLeads = cumulativeWinsHost.map((v,i)=> v - (cumulativeWinsGuest[i]||0));
    const pointLeads = cumulativePointsHost.map((v,i)=> v - (cumulativePointsGuest[i]||0));
    const leadSeries = S.statsBox2 === 0 ? gameLeads : pointLeads;
    const leadTitle = ['GAMES', 'POINTS', 'SCORES'][S.statsBox2] || 'GAMES';
    const leadPath = makeLinePath(leadSeries, {width:320,height:70,padding:16});
    const scoreHistory = orderedGames;

    const box3Titles = ['WIN MARGINS', `WIN MARGINS FOR ${p1Name.toUpperCase()}`, `WIN MARGINS FOR ${p2Name.toUpperCase()}`];
    const selectedMargins = S.statsBox3 === 0 ? margins : S.statsBox3 === 1 ? hostMargins : guestMargins;
    const histSvg = (() => {
      const w = 360, h = 80;
      const bins = 8;
      const values = selectedMargins.length ? selectedMargins : [];
      if (!values.length) return '';
      const maxVal = Math.max(...values, 1);
      const counts = new Array(bins).fill(0);
      values.forEach(v => {
        const index = Math.min(Math.floor((v / maxVal) * bins), bins - 1);
        counts[index]++;
      });
      const maxCount = Math.max(...counts, 1);
      return counts.map((c, i) => {
        const barH = (c / maxCount) * h;
        const x = (i / bins) * w + 2;
        const barW = (w / bins) - 4;
        return `<rect x="${x}" y="${h - barH}" width="${barW}" height="${barH}" fill="#1D9E75" opacity="0.65" />`;
      }).join('');
    })();

    content = `
      <div class="stats-grid">
        ${statsYears.length >= 3 ? `<div class="stats-year-filter" aria-label="Filter statistics by year">
          <button type="button" aria-label="Previous year" onclick="moveStatsYear(-1)" ${statsYears.length ? '' : 'disabled'}>&lsaquo;</button>
          <input type="number" aria-label="Statistics year; blank shows all years; double-click to cycle forward" title="Double-click to cycle years forward" placeholder="All" value="${S.statsYear === 'all' ? '' : S.statsYear}" ${statsYears.length ? `min="${statsYears[0]}" max="${statsYears[statsYears.length - 1]}"` : 'disabled'} step="1" inputmode="numeric" onchange="setStatsYear(this.value)" ondblclick="startStatsYearAnimation(event)"/>
          <button type="button" aria-label="Next year" onclick="moveStatsYear(1)" ${statsYears.length ? '' : 'disabled'}>&rsaquo;</button>
        </div>` : ''}
        ${S.statsYearError ? `<div class="stats-year-error" role="status">${escapeHTML(S.statsYearError)}</div>` : ''}
        <div class="stats-box" onclick="S.statsBox1=(S.statsBox1+1)%3;save();render();">
          <div class="stats-box-title">${box1Titles[S.statsBox1]}</div>
          <div class="stats-box-data stats-card-content" style="gap:10px;max-width:180px;margin:0 auto;">
            <div class="stats-box-row" style="justify-content:space-between;">
              <span class="stats-box-num">${box1Data[S.statsBox1][0]}</span>
              <span class="stats-box-label">${p1Name}</span>
            </div>
            <div class="stats-box-row" style="justify-content:space-between;">
              <span class="stats-box-num">${box1Data[S.statsBox1][1]}</span>
              <span class="stats-box-label">${p2Name}</span>
            </div>
          </div>
        </div>
        <div class="stats-box" onclick="S.statsBox2=(S.statsBox2+1)%3;save();render();">
          <div class="stats-box-title">${leadTitle}</div>
          ${S.statsBox2 === 2 ? `
            <div class="stats-recent stats-scores-history" id="stats-scores-history" onclick="event.stopPropagation();">
              <div class="stats-recent-row stats-recent-head">
                <span>Date</span><span>${p1Name}</span><span>${p2Name}</span>
              </div>
              ${scoreHistory.map(game => {
                const norm = normalizeGameDate(game.date || game.time || '');
                const scores = gameScores(game);
                return `<div class="stats-recent-row"><span>${escapeHTML(norm.date)}</span><span>${scores[0]}</span><span>${scores[1]}</span></div>`;
              }).join('')}
            </div>
          ` : `
            <div class="stats-card-content">
              <div class="chart-container" style="margin:0;padding:10px;border:none;">
                <svg viewBox="0 0 360 90" preserveAspectRatio="none" width="100%" height="90">
                  <path d="${leadPath}" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          `}
        </div>
        <div class="stats-box" onclick="S.statsBox3=(S.statsBox3+1)%3;save();render();">
          <div class="stats-box-title">${box3Titles[S.statsBox3]}</div>
          <div class="stats-card-content">
            <div class="chart-container" style="margin:0;padding:10px;border:none;">
              <svg viewBox="0 0 360 80" width="100%" height="80">${histSvg}</svg>
            </div>
          </div>
        </div>
      </div>
    `;
  } else {
    const currentKey = getContestKey(S.names);
    const contestOptions = Object.keys(S.contests).map(k => {
      const isSelected = !S.showNewContestInputs && currentKey === k;
      const displayKey = k.split('|').map(escapeHTML).join(' vs ');
      return `<option value="${escapeHTML(k)}" ${isSelected ? 'selected' : ''}>${displayKey}</option>`;
    }).join('');
    const dataMode = S.optionsDataMode || 'empty';
    const dataConfig = {
      empty: {label:'DATA', placeholder:''},
      import: {label:'DATA', placeholder:''},
      export: {label:'DATA', placeholder:'No scores to export'},
      'cloud-create': {label:'CLOUD SHEET', placeholder:'Choose a hard-to-guess name'},
      'cloud-download': {label:'DOWNLOAD CONTEST', placeholder:'Sheet name'},
      'new-contest': {label:'DATA', placeholder:'Player 1\nPlayer 2'}
    }[dataMode] || {label:'DATA',placeholder:''};
    const darkMode=S.theme==='dark';
    const dataActions = dataMode==='cloud-create'
        ? `<button class="action-btn primary" onclick="createCloudSheet()">Create sheet</button><button class="action-btn" onclick="cancelCloudFlow()">Cancel</button>`
        : dataMode==='cloud-download'
          ? `<button class="action-btn primary" onclick="downloadCloudContest()">Download</button><button class="action-btn" onclick="cancelCloudFlow()">Cancel</button>`
        : dataMode==='new-contest'
          ? `<button class="action-btn primary" onclick="createContestFromData()">Add</button><button class="action-btn" onclick="cancelNewContest()">Cancel</button>`
          : '';
    const cloudFields = dataMode==='cloud-create'
      ? `<label class="opt-label" for="cloud-sheet-name">Sheet name (keep it secret)</label>
         <input id="cloud-sheet-name" class="cloud-input" type="password" autocomplete="new-password" placeholder="${escapeHTML(dataConfig.placeholder)}" value="${escapeHTML(S.cloudSheetName || '')}" oninput="S.cloudSheetName=this.value"/>`
      : dataMode==='cloud-download'
        ? `<label class="opt-label" for="cloud-sheet-name">Sheet name</label>
           <input id="cloud-sheet-name" class="cloud-input" type="password" autocomplete="off" placeholder="${escapeHTML(dataConfig.placeholder)}" value="${escapeHTML(S.cloudSheetName || '')}" oninput="S.cloudSheetName=this.value"/>
           <label class="opt-label" for="cloud-player-1">Player 1</label>
           <input id="cloud-player-1" class="cloud-input" type="text" autocomplete="off" value="${escapeHTML(S.cloudNames[0] || '')}" oninput="S.cloudNames[0]=this.value"/>
           <label class="opt-label" for="cloud-player-2">Player 2</label>
           <input id="cloud-player-2" class="cloud-input" type="text" autocomplete="off" value="${escapeHTML(S.cloudNames[1] || '')}" oninput="S.cloudNames[1]=this.value"/>`
        : '';
    const showDataTextarea = dataMode==='import' || dataMode==='export' || dataMode==='new-contest';

    content = `
      <section class="opt-section parameters">
        <div class="opt-label opt-heading parameter-header">
          <span class="parameter-title">PARAMETERS</span>
        </div>
        <div class="parameter-row">
          <label for="player-select">Players</label>
          <select id="player-select" class="player-select" aria-label="Players" onchange="handleContestChange(this.value)">
            <option value="__NEW__" ${S.showNewContestInputs ? 'selected' : ''}>New...</option>
            <option value="__DOWNLOAD__">Download...</option>
            ${contestOptions}
          </select>
        </div>
        <div class="parameter-row option-row">
          <span>Options</span>
          <div class="option-pills">
            <label class="option-pill"><input id="cloud-enabled" type="checkbox" ${S.backupEnabled?'checked':''} onchange="setBackupEnabled(this.checked)"/>Cloud</label>
            <label class="option-pill"><input id="dark-enabled" type="checkbox" ${darkMode?'checked':''} onchange="toggleDarkMode(this.checked)"/>Dark</label>
            <label class="option-pill top-score-pill">
              <span>Max</span>
              <input id="target-score" type="number" value="${S.target}" min="25" max="500" step="25" onchange="S.target=Math.max(25,parseInt(this.value)||50);save();setStatus('Max score updated.',0);" inputmode="numeric"/>
            </label>
          </div>
        </div>
        <div class="parameter-row score-row">
          <span>Scores</span>
          <div class="data-action-row">
            <button class="action-btn ${dataMode==='import'?'primary':''}" onclick="${dataMode==='import'?'doImport()':'openImport()'}">${dataMode==='import'?'Import':'Import'}</button>
            <button class="action-btn" onclick="copyExport()">Export</button>
            <button class="action-btn danger" onclick="clearScores()">Erase</button>
          </div>
        </div>
      </section>

      <section class="opt-section data-panel">
        ${cloudFields || (showDataTextarea ? `
          <label class="opt-label" for="options-data">${escapeHTML(dataConfig.label)}</label>
          <textarea id="options-data" class="export-area" placeholder="${escapeHTML(dataConfig.placeholder)}" ${dataMode==='export'?'readonly':''} oninput="S.optionsDataText=this.value;save()">${escapeHTML(S.optionsDataText || '')}</textarea>
        ` : '')}
        ${dataActions ? `<div class="data-actions">${dataActions}</div>` : ''}
      </section>
    `;
  }

  const showStatusBarBottom = S.tab !== 0 && S.tab !== 1;
  const clearConfirm = S.tab === 2 && S.clearConfirm;
  const statusHtml = S.tab === 2 ? `
    <div class="status-bar option-status" onclick="event.stopPropagation();" ondblclick="showVersionStamp()">
      <div class="status-text ${S.status || activeHelpMessage || clearConfirm?'':'empty'}">
        ${clearConfirm
          ? `Erase local data for ${escapeHTML(clearConfirm.names[0] || 'Player 1')} vs ${escapeHTML(clearConfirm.names[1] || 'Player 2')}? The server copy will remain and can be restored with Download.`
          : escapeHTML(S.status || activeHelpMessage || 'Ready. Choose a parameter or score action.').replace(/\n/g,'<br/>')}
        ${clearConfirm ? `<div class="clear-confirm-actions">
          <button class="action-btn" onclick="cancelClearConfirmation()">Cancel</button>
          <button class="action-btn primary" onclick="performClearScores()">Confirm erase</button>
        </div>` : ''}
      </div>
      ${clearConfirm ? '' : `<div class="status-icon" onclick="${statusClick}; event.stopPropagation();" aria-label="${statusIcon==='?'?'Show help':'Dismiss status'}">${statusIcon}</div>`}
    </div>
  ` : (!showStatusBarBottom ? '' : `<div class="status-bar" onclick="${statusClick}" ondblclick="showVersionStamp()"><div class="status-text ${statusText?'':'empty'}">${statusText||' '}</div><div class="status-icon">${statusIcon}</div></div>`);
  appEl.innerHTML = `<div class="tab-content">${content}${statusHtml}</div><div class="tabbar">${tabbar}</div>`;
  const scoresHistory = appEl.querySelector('.stats-scores-history');
  if(scoresHistory) {
    scoresHistory.scrollTop = existingScoresHistoryScrollTop === null
      ? scoresHistory.scrollHeight
      : existingScoresHistoryScrollTop;
  }
  
  if (S.tab === 0 && showHistory) {
    patchMiniHistory(recentScores);
  }
  if(activeId) {
    const el = document.getElementById(activeId);
    if(el) {
      el.focus();
      if(el.tagName === 'INPUT' && el.type === 'text') {
        const val = el.value;
        el.value = '';
        el.value = val;
      }
    }
  }
}

load();
if(S.backupEnabled) syncActiveContest();
document.addEventListener('keydown', event => {
  const target = event.target;
  const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA';
  if(isInput) return;
  if(S.tab === 1 && S.statsBox2 === 2 && (event.key === 'j' || event.key === 'k') &&
      !event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) {
    const scoresHistory = document.getElementById('stats-scores-history');
    if(scoresHistory) {
      event.preventDefault();
      scoresHistory.scrollBy({top:event.key === 'j' ? 80 : -80, behavior:'smooth'});
      return;
    }
  }
  if(event.key === '?' && S.tab === 0 && !event.metaKey && !event.ctrlKey && !event.altKey) {
    event.preventDefault();
    showHelp();
    return;
  }
  if(event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
  
  if(event.key === 'g' || event.key === 'G') { event.preventDefault(); setTab(0); }
  else if(event.key === 's' || event.key === 'S') { event.preventDefault(); setTab(1); }
  else if(event.key === 'o' || event.key === 'O') { event.preventDefault(); setTab(2); }
});
document.addEventListener('click', event => {
  if(event===dominoAnnouncementEvent){
    dominoAnnouncementEvent=null;
    return;
  }
  if(dominoAnnouncementActive){
    dominoAnnouncementActive=false;
    dominoAnnouncementEvent=null;
    clearStatus();
    return;
  }
  if(S.tab===0 && S.phase==='start' && !event.target.closest('.scard, .tabbar, .status-bar')){
    showHelp();
    return;
  }
  if(Date.now() - LAST_STATUS_SET < 150) return;
  if (S.tab === 0 && waitingForHighDouble() && !event.target.closest('.scard') && !event.target.closest('.tabbar') && !event.target.closest('.status-bar')) {
    notifyHighDoublePrompt();
    return;
  }
  if(!S.status && !S.gameEndMessage) return;
  if(event.target.closest('.status-bar')) return;
  clearStatus();
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    // updateViaCache:'none' stops Safari from serving a stale sw.js from HTTP cache during update checks.
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => {
      return reg.update();
    }).catch(() => {});
  });
  // Reload once when a new service worker takes control, so users get the fresh app shell.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    location.reload();
  });
}

render();
</script>
</body>
