function clearPlayerHighlights(){
  S.starterSelection = false;
  S.showFirstPlayer = false;
}

function highDoublePrompt(){
  return 'Click player with high double to start a new game.';
}

function addScoreHistoryEntry(entry){
  S.scoreHistory.push(entry);
  S.shouldScrollHistory=true;
}

function updatePendingScoreEntry(){
  const points=parseInt(S.display,10);
  if(!S.display || !Number.isFinite(points)){
    if(S.pendingScoreEntryId){
      S.scoreHistory=S.scoreHistory.filter(entry=>entry.id!==S.pendingScoreEntryId);
      S.pendingScoreEntryId=null;
    }
    return;
  }
  if(!S.pendingScoreEntryId){
    S.pendingScoreEntryId=`pending:${S.nextScoreRowId++}`;
    S.scoreHistory.push({
      id:S.pendingScoreEntryId,
      kind:'score',
      pending:true,
      points,
      playerName:'',
      time:''
    });
  }else{
    const entry=S.scoreHistory.find(item=>item.id===S.pendingScoreEntryId);
    if(entry) entry.points=points;
  }
  S.shouldScrollHistory=true;
}

function assignPendingScoreEntry(rowId, points, playerName){
  if(!S.pendingScoreEntryId) return;
  const entry=S.scoreHistory.find(item=>item.id===S.pendingScoreEntryId);
  if(entry){
    entry.id=rowId;
    entry.pending=false;
    entry.points=points;
    entry.playerName=playerName;
  }
  S.pendingScoreEntryId=null;
}

function flashWinner(index){
  winnerFlashIdx=index;
  if(winnerFlashTimer) clearTimeout(winnerFlashTimer);
  render();
  winnerFlashTimer=setTimeout(()=>{
    winnerFlashIdx=-1;
    winnerFlashTimer=null;
    render();
  },1500);
}

function notifyStarterPrompt(){
  setStatus('Click player with high double to start a new game.',0,'error');
}

function notifyHighDoublePrompt(){
  setStatus('Click player with high double to start a new game.',0,'error');
}

function clearHelp(){
  S.helpMessage='';S.helpTab=-1;save();render();
}

function ackStatus(){
  if(S.status === 'Click here to reset everything.'){
    resetForNewGame();
    return;
  }
  if(S.helpMessage && S.helpTab === S.tab){
    clearHelp();
    return;
  }
  S.gameEndMessage='';
  clearStatus();
}

function showHelp(){
  clearStatus();
  S.helpTab = S.tab;
  if (S.tab === 2 && S.clearConfirm) {
    S.helpMessage = `Erase local data for ${S.clearConfirm.names[0] || 'Player 1'} vs ${S.clearConfirm.names[1] || 'Player 2'}?\nThe server copy remains.`;
  } else if (S.tab === 0) {
    if (S.phase === 'play') {
      S.helpMessage = `Enter number and click Player to add that to their score. Delete mistakes in recent scores by clicking red x. Replace by adding the correct score.`;
    } else if (S.phase === 'start') {
      S.helpMessage = `Click on player with highest double, then score by entering points and clicking on player tile.`;
    } else {
      S.helpMessage = `Game finished. ${highDoublePrompt()}`;
    }
  } else if (S.optionsDataMode === 'cloud-create') {
    const existing=getBackupConfig();
    S.helpMessage = existing.sheetName && existing.enabled===false
      ? `Click enable to restore cloud backup. Update Score keeper name as needed.`
      : `Choose a hard-to-guess sheet name and keep it secret. Anyone with the sheet name and both player names can download and add scores.`;
  } else if (S.optionsDataMode === 'cloud-download') {
    S.helpMessage = `Enter the sheet name and both player names exactly as shown in the shared contest. Download creates or attaches a local copy.`;
  } else if (S.optionsDataMode === 'new-contest') {
    S.helpMessage = `Enter both player names and select Add to create a local contest.`;
  } else if (S.optionsDataMode === 'import') {
    S.helpMessage = `Paste score data in the format shown, then select Import to add it to this contest.`;
  } else if (S.optionsDataMode === 'export') {
    S.helpMessage = `Export copies this contest's completed scores. Save the copied text somewhere safe.`;
  } else if (S.optionsDataMode === 'erase-confirm') {
    S.helpMessage = `Erase removes local scores for this contest. The server copy remains and can be restored with Download.`;
  } else if (S.tab === 2 && S.backupEnabled === false) {
    S.helpMessage = `Cloud backup disabled.`;
  } else if (S.tab === 2 && S.theme === 'dark') {
    S.helpMessage = `Dark mode set.`;
  } else if (S.tab === 2) {
    S.helpMessage = `Dark mode set to system appearance.`;
  } else {
    S.helpMessage = `Create a contest with New..., or copy a shared contest with Download.... Import and Export move score data. Erase removes only the local copy.`;
  }
  save();render();
}

function resetForNewGame(){
  S.scores=[0,0];S.handScores=[0,0];S.display='';S.records=[];
  S.pendingScoreEntryId=null;
  S.lastGameRecentScores=[];
  S.gameOver=false;S.pendingWin=false;S.phase='start';
  S.starterSelection=true;
  S.firstPlayer=-1;S.handFirstPlayer=-1;S.handNum=0;
  S.lastAdded=['',''];S.showFirstPlayer=false;S.editingIdx=-1;
  S.status='';S.statusUntil=0;S.gameEndMessage='';S.lastGameEndStatus='';S.highestDoublePlayer=-1;S.tab=0;
  save();render();
}

function pressKey(v){
  if(S.phase==='start'){
    notifyStarterPrompt();
    return;
  }
  if(waitingForHighDouble()){
    notifyHighDoublePrompt();
    return;
  }
  if(S.gameOver||S.phase==='end')return;
  if(S.display.length>=3)return;
  const hadPlayerHighlight = S.starterSelection || S.showFirstPlayer;
  clearPlayerHighlights();
  S.display+=v;
  updatePendingScoreEntry();
  if(hadPlayerHighlight){save();render();return;}
  save();
  render();
  const el=document.getElementById('display-bar');
  if(el){el.textContent=S.display;el.className='display-bar';}
}

function delKey(){
  if(S.phase==='start'){
    notifyStarterPrompt();
    return;
  }
  if(waitingForHighDouble()){
    notifyHighDoublePrompt();
    return;
  }
  const hadPlayerHighlight = S.starterSelection || S.showFirstPlayer;
  clearPlayerHighlights();
  S.display=S.display.slice(0,-1);
  updatePendingScoreEntry();
  if(hadPlayerHighlight){save();render();return;}
  save();
  render();
  const el=document.getElementById('display-bar');
  if(el){el.textContent=S.display||'0';el.className='display-bar'+(S.display?'':' dim');}
}

function tapPlayer(i){
  const startingNewGame = S.phase==='end';
  clearPlayerHighlights();
  if (S.phase==='end') {
    S.scores = [0, 0];
    S.handScores = [0, 0];
    clearScoreHistoryIfNoScores();
    S.display = '';
    S.gameOver = false;
    S.pendingWin = false;
    S.phase = 'start';
    S.starterSelection = false;
    S.firstPlayer = -1;
    S.handFirstPlayer = -1;
    S.handNum = 0;
    S.lastAdded = ['', ''];
    S.showFirstPlayer = false;
    S.editingIdx = -1;
    S.status = '';
    S.statusUntil = 0;
    S.helpMessage = '';S.helpTab = -1;
    S.gameEndMessage = '';
    S.lastGameEndStatus = '';
    S.highestDoublePlayer = -1;
    S.tab = 0;
  }
  if(S.gameOver)return;
  const pts=S.phase==='start' ? 0 : parseInt(S.display)||0;
  if(S.phase==='start'){
    S.scores=[0,0];
    S.handScores=[0,0];
    clearScoreHistoryIfNoScores();
    const starter=i;
    S.highestDoublePlayer=i;
    S.firstPlayer=starter;
    S.handFirstPlayer=starter;
    S.handNum=1;
    S.showFirstPlayer=true;
    if(pts>0){
      S.scores[i]+=pts;S.handScores[i]+=pts;
      S.lastAdded=['',''];S.lastAdded[i]='+'+pts;
      const rowId = S.nextScoreRowId++;
      const record={id:rowId,who:i,pts,time:ts(),type:'score',hand:1,totalAfter:[S.scores[0],S.scores[1]]};
      S.records.push(record);
      addScoreHistoryEntry({id:rowId,kind:'score',points:pts,playerName:S.names[i],time:record.time});
      if(S.scores[i]>=S.target)S.pendingWin=true;
    }
    S.display='';S.phase='play';
    S.status='';S.statusUntil=0;S.helpMessage='';S.helpTab=-1;
    if(startingNewGame) S.lastGameEndStatus='';
    save();render();return;
  }
  if(pts<=0){
    S.display='';
    updatePendingScoreEntry();
    const el=document.getElementById('display-bar');
    if(el){el.textContent='0';el.className='display-bar dim';}
    return;
  }
  S.status='';S.statusUntil=0;S.helpMessage='';S.helpTab=-1;
  S.showFirstPlayer = false;
  S.scores[i]+=pts;S.handScores[i]+=pts;
  S.lastAdded=['',''];S.lastAdded[i]='+'+pts;
  const rowId = S.nextScoreRowId++;
  const record={id:rowId,who:i,pts,time:ts(),type:'score',hand:S.handNum,totalAfter:[S.scores[0],S.scores[1]]};
  S.records.push(record);
  assignPendingScoreEntry(rowId,pts,S.names[i]);
  if(!S.scoreHistory.some(entry=>entry.id===rowId)){
    addScoreHistoryEntry({id:rowId,kind:'score',points:pts,playerName:S.names[i],time:record.time});
  }
  if(S.scores[i]>=S.target)S.pendingWin=true;
  S.display='';
  save();render();
}

function callDomino(event){
  if(S.phase==='start'){
    notifyStarterPrompt();
    return;
  }
  if(waitingForHighDouble()){
    notifyHighDoublePrompt();
    return;
  }
  clearStarterSelection();
  if(S.phase!=='play'||S.gameOver){
    return;
  }
  
  const gameEnds = S.pendingWin && S.scores[0] !== S.scores[1];
  const handTotals = [S.handScores[0], S.handScores[1]];
  
  // Record the domino call
  const dominoRecord={
    id: S.nextScoreRowId++,
    who: -1, pts: 0, time: ts(), type: 'domino', hand: S.handNum,
    totalAfter: [S.scores[0], S.scores[1]],
    handTotals, gameEnds
  };
  S.records.push(dominoRecord);
  const handWinner = handTotals[0] === handTotals[1] ? -1 : (handTotals[0] > handTotals[1] ? 0 : 1);
  addScoreHistoryEntry({
    id:dominoRecord.id,
    kind:'hand',
    scores:handTotals,
    label:handWinner < 0 ? 'tied hand' : `${S.names[handWinner]} hand`
  });

  S.gameEndMessage = '';
  let flashIndex=-1;
  
  if (gameEnds) {
    S.pendingWin = false;
    
    if (S.scores[0] !== S.scores[1]) {
      const gameWinner = S.scores[0] > S.scores[1] ? 0 : 1;
      const now = new Date();
      const finishedGameKey=formatIsoDate(now);
      const gameoverRecord={
        id:S.nextScoreRowId++,
        who:-1,pts:0,time:ts(),type:'gameover',
        finalScores: [S.scores[0], S.scores[1]], winnerIdx: gameWinner, winnerName: S.names[gameWinner]
      };
      S.records.push(gameoverRecord);
      addScoreHistoryEntry({
        id:gameoverRecord.id,
        kind:'game',
        gameKey:finishedGameKey,
        scores:[S.scores[0],S.scores[1]],
        label:`${S.names[gameWinner]} game`
      });
      S.pastGames.unshift({
        time: ds(now), date: formatIsoDate(now), names: [S.names[0], S.names[1]],
        scores: [S.scores[0], S.scores[1]], winnerIdx: gameWinner,
        scorekeeper:S.scorekeeperName.trim() || S.names[0]
      });
      queueFinishedGame(now);
      S.gameOver = true;
      S.phase = 'end';
      S.showFirstPlayer = false;
      END_SCORE_HOLD = [S.scores[0], S.scores[1]];
      S.scores = [0, 0];
      flashIndex=gameWinner;
    } else {
      const gameoverRecord={
        id:S.nextScoreRowId++,
        who:-1,pts:0,time:ts(),type:'gameover',
        finalScores:[S.scores[0],S.scores[1]],winnerIdx:-1,winnerName:''
      };
      S.records.push(gameoverRecord);
      addScoreHistoryEntry({id:gameoverRecord.id,kind:'game',scores:[S.scores[0],S.scores[1]],label:'tied game'});
      S.gameOver = true;
      S.phase = 'end';
      S.showFirstPlayer = false;
    }
  } else {
    // Next hand always alternates starter, regardless of who scored
    const nextStarter = S.handFirstPlayer === 0 ? 1 : 0;
    S.handFirstPlayer = nextStarter;
    S.firstPlayer = nextStarter;
    S.handNum++;
    S.showFirstPlayer = true;
  }
  
  S.handScores = [0, 0];
  S.lastAdded = ['', ''];
  S.display = '';
  S.helpContext = 'play';
  if(S.phase==='end'){
    S.lastGameRecentScores=S.records.filter(record=>record.type==='score').slice(-4).map(record=>({...record}));
  }
  S.status='';
  S.statusUntil=0;
  S.helpMessage='';
  S.helpTab=-1;
  save();
  render();
  if(flashIndex>=0) flashWinner(flashIndex);
}

function recalcTotals(){
  const running=[0,0];
  const handRunning=[0,0];
  for(const rec of S.records){
    if(rec.type==='score'){
      running[rec.who]+=rec.pts;
      handRunning[rec.who]+=rec.pts;
      rec.totalAfter=[running[0],running[1]];
      const historyEntry=S.scoreHistory.find(entry=>entry.id===rec.id);
      if(historyEntry) historyEntry.points=rec.pts;
    } else if(rec.type==='domino'){
      rec.totalAfter=[running[0],running[1]];
      rec.handTotals=[...handRunning];
      const historyEntry=S.scoreHistory.find(entry=>entry.id===rec.id);
      if(historyEntry){
        historyEntry.scores=[...handRunning];
        const winner=handRunning[0]===handRunning[1]?-1:(handRunning[0]>handRunning[1]?0:1);
        historyEntry.label=winner<0?'tied':`${S.names[winner]} takes hand`;
      }
      handRunning[0]=0;
      handRunning[1]=0;
      if(rec.gameEnds){running[0]=0;running[1]=0;}
    } else if(rec.type==='gameover'){
      rec.finalScores=[running[0],running[1]];
      const historyEntry=S.scoreHistory.find(entry=>entry.id===rec.id);
      if(historyEntry) historyEntry.scores=[...running];
      running[0]=0;running[1]=0;
    }
  }
  S.scores=[running[0],running[1]];
  S.handScores=[...handRunning];
  S.pendingWin=S.scores[0]>=S.target||S.scores[1]>=S.target;
}

function deleteRecord(id){
  if(S.phase==='end' || S.gameOver) return;
  const idx = S.records.findIndex(record => record.id === id);
  if(idx === -1) return;
  S.records.splice(idx,1);
  S.scoreHistory=S.scoreHistory.filter(entry=>entry.id!==id);
  recalcTotals();S.gameOver=false;S.pendingWin=false;
  save();render();
}

function deleteScore(id){
  if(S.phase==='end' || S.gameOver) return;
  const idx = S.records.findIndex(r => r.id === id);
  if (idx === -1) return;
  const row = document.querySelector(`.hist-mini-row[data-history-id="${id}"]`);
  if (row) {
    row.classList.add('removing');
    setTimeout(() => {
      deleteRecord(id);
    }, 220);
  } else {
    deleteRecord(id);
  }
}

function patchMiniHistory(historyEntries) {
  const statusTextContainer = document.querySelector('.status-bar .status-text');
  if (!statusTextContainer) return;
  let list = statusTextContainer.querySelector('.hist-mini');

  if (!list) {
    statusTextContainer.innerHTML = '<div class="hist-mini"></div>';
    list = statusTextContainer.querySelector('.hist-mini');
  }
  list.onclick=event=>event.stopPropagation();
  const oldScrollTop=list.scrollTop;
  const wasAtBottom=list.scrollHeight-list.scrollTop-list.clientHeight<8;
  const nextRows=historyEntries.map(entry=>{
    const row=document.createElement('div');
    row.className='hist-mini-row';
    row.dataset.historyId=String(entry.id);
    if(entry.kind==='score'){
      const record=S.records.find(current=>current.id===entry.id && current.type==='score');
      if(record && !S.gameOver && S.phase!=='end'){
        const button=document.createElement('button');
        button.type='button';
        button.className='hist-mini-x';
        button.textContent='×';
        button.setAttribute('aria-label','Delete score');
        button.onclick=event=>{event.stopPropagation();deleteScore(entry.id);};
        row.appendChild(button);
      }else if(entry.pending){
        const blank=document.createElement('span');
        blank.className='hist-mini-old';
        blank.textContent='';
        blank.setAttribute('aria-label','Score awaiting player');
        row.appendChild(blank);
      }else{
        const old=document.createElement('span');
        old.className='hist-mini-old';
        old.textContent='-';
        old.setAttribute('aria-label','Previous game score');
        row.appendChild(old);
      }
      const points=document.createElement('span');
      points.className='hist-mini-pts';
      points.textContent=String(entry.points);
      const name=document.createElement('span');
      name.className='hist-mini-name';
      name.textContent=entry.playerName || '';
      row.append(points,name);
    }else{
      if(entry.kind==='hand'){
        const icon=document.createElement('img');
        icon.className='hist-mini-icon';
        icon.src='domino.svg';
        icon.alt='Hand';
        row.appendChild(icon);
      }else{
        const icon=document.createElement('span');
        icon.className='hist-mini-icon';
        icon.textContent='★';
        icon.setAttribute('aria-label','Game');
        row.appendChild(icon);
      }
      const pair=document.createElement('span');
      pair.className='hist-mini-pair';
      pair.textContent=(entry.scores || []).join('/');
      const label=document.createElement('span');
      label.className='hist-mini-label';
      label.textContent=entry.label || '';
      row.append(pair,label);
    }
    return row;
  });
  list.replaceChildren(...nextRows);
  if(S.shouldScrollHistory || wasAtBottom) list.scrollTop=list.scrollHeight;
  else list.scrollTop=oldScrollTop;
  S.shouldScrollHistory=false;
}

function startEdit(idx){
  S.editingIdx=idx;
  render();
  setTimeout(()=>{
    const inp=document.getElementById('edit-input-'+idx);
    if(inp){inp.focus();inp.select();}
  },50);
}

function commitEdit(idx){
  const inp=document.getElementById('edit-input-'+idx);
  if(!inp)return;
  const newPts=parseInt(inp.value);
  if(!isNaN(newPts)&&newPts>=0){
    S.records[idx].pts=newPts;
    recalcTotals();
  }
  S.editingIdx=-1;
  save();render();
}

function cancelEdit(){S.editingIdx=-1;render();}

function getExportText(){
  const lines = [`Date,${S.names[0]},${S.names[1]}`];
  (S.pastGames || []).forEach(g => {
    const norm = normalizeGameDate(g.date || g.time || '');
    const scores = Array.isArray(g.scores) ? g.scores : [Number(g.p1_score || 0), Number(g.p2_score || 0)];
    lines.push(`${norm.date},${scores[0]},${scores[1]}`);
  });
  return lines.join('\n');
}

function copyExport(){
  const data=getExportText();
  const count = (S.pastGames || []).length;
  S.optionsDataMode='export';
  S.optionsDataText=data;
  save();
  render();
  setStatus(`${count} scores in Data, copy and paste to save`,0);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(()=>{
      if(S.optionsDataMode==='export') setStatus(`${count} scores in Data, copy and paste to save`,0);
    }).catch(()=>{
      if(S.optionsDataMode!=='export') return;
      setStatus(`${count} scores in Data, copy and paste to save`,0);
      selectExportData();
    });
  } else {
    setStatus(`${count} scores in Data, copy and paste to save`,0);
    selectExportData();
  }
}

function selectExportData(){
  const taEl=document.getElementById('options-data');
  if(taEl){taEl.focus();taEl.select();}
}

async function appendContestDataToCloud(games, names, expectedEpoch) {
  const contest = getContestKey(names);
  const config=getBackupConfig(contest);
  const url = getBackupUrl(contest);
  if (!config.enabled || !url || !config.sheetName || !games.length) return {ok:true,conflicts:0};
  if(typeof expectedEpoch === 'undefined') expectedEpoch = getClearEpoch(contest);
  return withContestLock(contest, async () => {
    if(expectedEpoch !== getClearEpoch(contest)) return null;
    try {
      const payloadGames = games.map(game => ({
        date: normalizeGameDate(game.date || game.time || '').date,
        p1_score: Number(game.scores ? game.scores[0] : (game.p1_score || 0)),
        p2_score: Number(game.scores ? game.scores[1] : (game.p2_score || 0)),
        scorekeeper:String(game.scorekeeper || config.scorekeeper || names[0])
      }));
      const response = await fetch(url,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({
        mode:'append',sheet:config.sheetName,names:[...names],games:payloadGames
      })});
      if(!response.ok) throw new Error(`Cloud sync failed (${response.status})`);
      const result = await response.json();
      if(result.status !== 'success') throw new Error(result.message || 'Cloud sync failed');
      if(Number(result.conflicts || 0) > 0 && contest===getContestKey(S.names)){
        setStatus(`Cloud kept its existing score for ${result.conflicts} timestamp conflict${Number(result.conflicts)===1?'':'s'}.`,7000,'error');
      }
      return {ok:true,conflicts:Number(result.conflicts || 0)};
    } catch (e) {
      const pending = readPendingGames();
      payloadGames.forEach(game => {
        const pendingGame = {...game,contest,names:[...names]};
        if(!pending.some(item => item.contest === contest && gameKey(item) === gameKey(pendingGame))) pending.push(pendingGame);
      });
      writePendingGames(pending);
      return {ok:false,conflicts:0};
    }
  });
}

async function doImport(){
  const ta=document.getElementById('options-data');
  if(!ta||!ta.value.trim()){
  setStatus('Paste score data into Data before importing.',0,'error');
    return;
  }
  S.optionsDataText=ta.value;
  try{
    const rawLines = ta.value.trim().split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    if(rawLines.length < 1) return;

    const parseCsv = line => line.split(',').map(part => part.trim());
    const firstLine = parseCsv(rawLines[0]);
    let names = [];
    let games = [];

    if (firstLine[0] && firstLine[0].toLowerCase() === 'date') {
      names = [firstLine[1] || '', firstLine[2] || ''];
      if (!names[0] || !names[1]) {
        setStatus('Invalid CSV header: expected date,Player 1,Player 2',5000,'error');
        return;
      }
      for(let i=1; i<rawLines.length; i++) {
        const row = parseCsv(rawLines[i]);
        if(row.length < 3) continue;
        const dateValue = row[0];
        const s1 = parseInt(row[1], 10);
        const s2 = parseInt(row[2], 10);
        if(!dateValue || isNaN(s1) || isNaN(s2)) continue;
        const norm = normalizeGameDate(dateValue);
        games.push({
          time: norm.time,
          date: norm.date,
          names: [...names],
          scores: [s1, s2],
          winnerIdx: s1 >= s2 ? 0 : 1
        });
      }
    } else {
      names = rawLines[0].split('|').map(n => n.trim());
      if(names.length !== 2 || !names[0] || !names[1]) {
        setStatus('Invalid first line: use "date,Player 1,Player 2" or the legacy "Player 1 | Player 2" format',5000,'error');
        return;
      }
      for(let i=1; i<rawLines.length; i++) {
        const line = rawLines[i];
        const parts = line.split(/\s+/);
        if(parts.length < 3) continue;

        const s2 = parseInt(parts[parts.length - 1], 10);
        const s1 = parseInt(parts[parts.length - 2], 10);
        if(isNaN(s1) || isNaN(s2)) continue;

        const rawDate = parts.slice(0, parts.length - 2).join(' ');
        const norm = normalizeGameDate(rawDate);

        games.push({
          time: norm.time,
          date: norm.date,
          names: [...names],
          scores: [s1, s2],
          winnerIdx: s1 >= s2 ? 0 : 1
        });
      }
    }

    if(rawLines.length > 1 && games.length === 0) {
      setStatus('No valid games found — expected date,score1,score2 rows',5000,'error');
      return;
    }
    
    const targetNames=names.map(name => name.trim());
    const normalizedGames = games.map(game => ({...game, names:targetNames}));
    const uniqueGames = [];
    const seenKeys = new Set();
    for (const game of normalizedGames) {
      const key = gameKey(game);
      if (seenKeys.has(key)) continue;
      seenKeys.add(key);
      uniqueGames.push(game);
    }
    const contest = getContestKey(targetNames);
    const importEpoch = getClearEpoch(contest);
    const importResult = await withContestLock(contest, () => {
      if(importEpoch !== getClearEpoch(contest)) return null;
      const isActive = getContestKey(S.names) === contest;
      const storedContest = S.contests[contest];
      const previousGames = isActive ? (S.pastGames || []) : (storedContest?.pastGames || readStoredContestGames(contest));
      const previous = mergeGameLists(previousGames, []);
      const previousByTimestamp = new Map(previous.map(game => [gameKey(game), game]));
      const added = uniqueGames.filter(game => !previousByTimestamp.has(gameKey(game)));
      const conflicts = uniqueGames.filter(game => {
        const current = previousByTimestamp.get(gameKey(game));
        if(!current) return false;
        const existingScores = gameScores(current);
        const importedScores = gameScores(game);
        return existingScores[0] !== importedScores[0] || existingScores[1] !== importedScores[1];
      }).length;
      const merged = mergeGameLists(previous, uniqueGames);
      if(!S.contests[contest]) S.contests[contest] = createEmptyContest(targetNames);
      S.contests[contest].pastGames = merged;
      if(isActive) {
        S.pastGames = merged;
        updateContest();
      }
      S.optionsDataMode='empty';
      S.optionsDataText='';
      save();
      render();
      return {added, conflicts};
    });
    if(importResult === null){setStatus('Import canceled because contest scores were cleared.',5000,'error');return;}
    S.showNewContestInputs=false;
    switchContest(targetNames);
    if (getBackupConfig(contest).enabled && getBackupUrl(contest) && importResult.added.length) {
      const synced = await appendContestDataToCloud(importResult.added, targetNames, importEpoch);
      if(synced === null){setStatus('Scores were cleared before cloud sync completed.',5000,'error');return;}
      if(!synced.ok){setStatus('Scores added locally, but cloud sync failed.',5000,'error');return;}
      if(synced.conflicts){setStatus(`Scores added locally; the server kept ${synced.conflicts} existing score${synced.conflicts===1?'':'s'} for timestamp conflicts.`,7000,'error');return;}
    }
    if(importEpoch !== getClearEpoch(contest)){setStatus('Scores were cleared before import completed.',5000,'error');return;}
    S.optionsDataMode='empty';
    S.optionsDataText='';
    const submitted = Math.max(0, rawLines.length - 1);
    const invalidRows = submitted - games.length;
    const importSummary = `Added ${importResult.added.length} of ${submitted} score${submitted === 1 ? '' : 's'} to ${targetNames[0]} vs ${targetNames[1]}.` +
      (importResult.conflicts ? ` Kept ${importResult.conflicts} existing local timestamp conflict${importResult.conflicts === 1 ? '' : 's'}.` : '') +
      (invalidRows > 0 ? ` Ignored ${invalidRows} invalid row${invalidRows === 1 ? '' : 's'}.` : '');
    save();
    render();
    setStatus(importSummary,3000,importResult.conflicts || invalidRows>0?'error':'info');
  }catch(err){setStatus('Could not parse data — check the format and try again.',5000,'error');}
}

function handleContestChange(val) {
  if (val === '__NEW__') {
    S.lastNames = [...S.names];
    S.showNewContestInputs = true;
    S.hideNewContestHelp = false;
    S.newNames = ['', ''];
    S.optionsDataMode='new-contest';
    S.optionsDataText='';
    save();
    render();
    setStatus('Add player names and press Add.');
  } else if (val === '__DOWNLOAD__') {
    beginCloudDownload();
  } else if (val) {
    S.showNewContestInputs = false;
    S.newNames = ['', ''];
    S.optionsDataMode='empty';
    S.optionsDataText='';
    switchContest(S.contests[val].names);
  }
}

function cancelNewContest() {
  const hasContests = Object.keys(S.contests).length > 0;
  if (!hasContests) {
    S.optionsDataMode='empty';
    S.optionsDataText='';
    S.showNewContestInputs=false;
    render();
    return;
  }
  S.showNewContestInputs = false;
  S.newNames = ['', ''];
  S.optionsDataMode='empty';
  S.optionsDataText='';
  const target = (S.lastNames && (S.lastNames[0] || S.lastNames[1])) 
    ? S.lastNames 
    : S.contests[Object.keys(S.contests)[0]].names;
  switchContest(target);
}

function switchContest(newNames, skipCurrentUpdate = false) {
  stopStatsYearAnimation();
  S.pendingScoreEntryId=null;
  if(winnerFlashTimer) clearTimeout(winnerFlashTimer);
  winnerFlashTimer=null;
  winnerFlashIdx=-1;
  if (!skipCurrentUpdate) updateContest();
  const key = getContestKey(newNames);
  const c = S.contests[key];
  if (c) {
    S.scores = c.scores;
    S.handScores = c.handScores;
    S.records = c.records;
    S.scoreHistory = truncateScoreHistory(c.scoreHistory || [], c.records || []);
    S.scorekeeperName = c.scorekeeperName || '';
    S.lastGameRecentScores = c.lastGameRecentScores || [];
    S.pastGames = c.pastGames;
    S.target = c.target;
    S.gameOver = c.gameOver;
    S.phase = c.phase;
    S.firstPlayer = c.firstPlayer;
    S.handFirstPlayer = c.handFirstPlayer;
    S.handNum = c.handNum;
    S.lastAdded = c.lastAdded;
    S.pendingWin = c.pendingWin;
    S.starterSelection = typeof c.starterSelection === 'boolean' ? c.starterSelection : c.phase === 'start';
    S.highestDoublePlayer = c.highestDoublePlayer;
    S.lastGameEndStatus = c.lastGameEndStatus || '';
    S.theme = c.theme || 'system';
  } else {
    S.scores = [0, 0];
    S.handScores = [0, 0];
    S.records = [];
    S.scoreHistory = [];
    S.scorekeeperName = '';
    S.lastGameRecentScores = [];
    S.pastGames = [];
    S.gameOver = false;
    S.phase = 'start';
    S.firstPlayer = -1;
    S.handFirstPlayer = -1;
    S.handNum = 0;
    S.lastAdded = ['', ''];
    S.pendingWin = false;
    S.starterSelection = true;
    S.highestDoublePlayer = -1;
    S.lastGameEndStatus = '';
  }
  S.names = [...newNames];
  S.statsYear = 'all';
  S.statsYearError = '';
  S.newNames = ['', ''];
  S.helpMessage = '';
  S.helpTab = -1;
  S.gameEndMessage = '';
  S.status = '';
  S.statusUntil = 0;
  S.showFirstPlayer = false;
  S.optionsDataMode='empty';
  S.optionsDataText='';
  S.cloudSheetName='';
  S.cloudScorekeeper='';
  const backupConfig=getBackupConfig(key);
  S.backupEnabled=backupConfig.enabled;
  S.scriptVersion=backupConfig.scriptVersion;
  S.scoreHistory=ensureGameHistoryEntries(S.pastGames,S.names,S.scoreHistory);
  updateContest();
  applyTheme();
  save();
  render();
  if(S.backupEnabled) syncActiveContest();
}

function setTab(t){
  stopStatsYearAnimation();
  S.editingIdx=-1;
  S.tab=t;
  S.status='';
  S.statusUntil=0;
  S.gameEndMessage='';
  S.helpMessage='';
  S.helpTab=-1;
  S.clearConfirm=null;
  if (t === 2 && (S.names[0] || S.names[1])) {
    S.showNewContestInputs = false;
  }
  save();
  render();
}

function gameYear(game){
  const rawDate = game.date || game.time;
  if(!rawDate) return null;
  const date = normalizeGameDate(rawDate).date;
  const match = String(date).match(/^(\d{4})-/);
  return match ? Number(match[1]) : null;
}

function getStatsYears(games){
  return [...new Set(games.map(gameYear).filter(year => year !== null))].sort((a,b) => a-b);
}

function moveStatsYear(direction){
  stopStatsYearAnimation();
  const years = getStatsYears(S.pastGames || []);
  if(!years.length) return;
  const current = S.statsYear === 'all' ? -1 : years.indexOf(Number(S.statsYear));
  if(current < 0) {
    S.statsYear = direction > 0 ? years[0] : years[years.length - 1];
  } else if(direction > 0) {
    S.statsYear = current === years.length - 1 ? 'all' : years[current + 1];
  } else {
    S.statsYear = current === 0 ? 'all' : years[current - 1];
  }
  S.statsYearError = '';
  save();
  render();
}

function stopStatsYearAnimation(){
  if(statsYearAnimationTimer!==null){
    clearInterval(statsYearAnimationTimer);
    statsYearAnimationTimer=null;
  }
}

function startStatsYearAnimation(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  stopStatsYearAnimation();
  const years=getStatsYears(S.pastGames || []);
  if(years.length<3 || S.tab!==1) return;
  if(S.statsYear==='all' || !years.includes(Number(S.statsYear))){
    S.statsYear=years[0];
    S.statsYearError='';
    save();
    render();
  }
  const currentIndex=years.indexOf(Number(S.statsYear));
  if(currentIndex<0 || currentIndex===years.length-1) return;
  statsYearAnimationTimer=setInterval(()=>{
    const index=years.indexOf(Number(S.statsYear));
    if(index<0 || index>=years.length-1){
      stopStatsYearAnimation();
      return;
    }
    S.statsYear=years[index+1];
    S.statsYearError='';
    save();
    render();
    if(index+1===years.length-1) stopStatsYearAnimation();
  },1000);
}

function setStatsYear(value){
  stopStatsYearAnimation();
  if(value === '') {
    S.statsYear = 'all';
    S.statsYearError = '';
    save();
    render();
    return;
  }
  const year = Number(value);
  if(!Number.isInteger(year) || !getStatsYears(S.pastGames || []).includes(year)) {
    S.statsYearError = 'Choose a year with recorded games.';
    render();
    return;
  }
  S.statsYear = year;
  S.statsYearError = '';
  save();
  render();
}

    }

      if (k.classList.contains('domino-key')) {
        k.innerHTML = domTile();
        if (controlsDisabled) k.classList.add('disabled');
        else k.classList.remove('disabled');
      } else {
        if (controlsDisabled) k.classList.add('disabled');
        else k.classList.remove('disabled');
      }
    });

    // 3. Scoreboard Cards
    const scards = appEl.querySelectorAll('.scoreboard .scard');
    [0, 1].forEach(i => {
      const sc = scards[i];
      if (sc) {
        sc.className = `scard ${highlightPlayers ? 'select-starter' : ''} ${S.showFirstPlayer && S.firstPlayer===i ? 'first-player' : ''} ${winnerFlashIdx===i ? 'winner-flash' : ''}`;
        const pname = sc.querySelector('.pname');
        const scoreTot = sc.querySelector('.score-total');
        if (pname && pname.textContent !== S.names[i]) pname.textContent = S.names[i];
        const scoreValue = END_SCORE_HOLD ? END_SCORE_HOLD[i] : (isStart ? 0 : S.scores[i]);
        const val = scoreValue > 0 ? String(scoreValue) : '';
        if (scoreTot && scoreTot.textContent !== val) scoreTot.textContent = val;
      }
    });

    // 4. Status Bar
    const statusBar = appEl.querySelector('.status-bar');
    const statusTextEl = appEl.querySelector('.status-bar .status-text');
    const statusIconEl = appEl.querySelector('.status-bar .status-icon');
    if (statusBar) statusBar.setAttribute('onclick', statusClick);
    if (statusIconEl) statusIconEl.innerHTML = statusIcon;
    
    if (statusTextEl) {
      if (statusText) {
        statusTextEl.innerHTML = escapeHTML(statusText).replace(/\n/g, '<br/>');
        statusTextEl.classList.remove('empty');
      } else if (showHistory) {
        statusTextEl.classList.remove('empty');
        patchMiniHistory(historyEntries);
      } else {
        statusTextEl.innerHTML = defaultStartStatus ? escapeHTML(defaultStartStatus) : '&nbsp;';
        if (!defaultStartStatus) statusTextEl.classList.add('empty');
        else statusTextEl.classList.remove('empty');
      }
    }

    // 5. Tabbar
    const tabbarEl = appEl.querySelector('.tabbar');
    if (tabbarEl) tabbarEl.innerHTML = tabbar;
    return;
  }

  appEl.dataset.tab = String(S.tab);
  let content = '';
  if(S.tab===0){
    const isStart=S.phase==='start';
    const highlightPlayers = S.phase === 'start' || waitingForHighDouble();
    const displayClass=S.display?'display-bar':'display-bar dim';
    const cards=[0,1].map(i=>`
      <div class="scard ${highlightPlayers?'select-starter':''} ${S.showFirstPlayer && S.firstPlayer===i?'first-player':''} ${winnerFlashIdx===i?'winner-flash':''}" onclick="tapPlayer(${i})">
        <div class="pname">${escapeHTML(S.names[i])}</div>
        <div class="score-total">${END_SCORE_HOLD ? (END_SCORE_HOLD[i] > 0 ? END_SCORE_HOLD[i] : '') : (!isStart && S.scores[i] > 0 ? S.scores[i] : '')}</div>
      </div>`).join('');
    const dominoLabel=domTile();

    const statusInner = statusText 
      ? escapeHTML(statusText).replace(/\n/g, '<br/>') 
      : (showHistory ? '<div class="hist-mini"></div>' : '&nbsp;');

    content=`
      <div class="scoreboard">${cards}</div>
      <div class="numpad-wrap">
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key ${controlsDisabled?'disabled':''}" onclick="pressKey('${n}')">${n}</div>`).join('')}
          <div class="key del ${controlsDisabled?'disabled':''}" onclick="delKey()">&#9003;</div>
          <div class="key ${controlsDisabled?'disabled':''}" onclick="pressKey('0')">0</div>
          <div class="key domino-key ${controlsDisabled?'disabled':''}" onclick="callDomino(event)">${dominoLabel}</div>

      <div class="status-bar score-status" onclick="${statusClick}">
        <div class="status-text ${(!statusText && !showHistory && !defaultStartStatus) ? 'empty' : ''}">
          ${statusInner}
        </div>

    `;
  } else if(S.tab===1){
    const allGames = S.pastGames || [];
    const statsYears = getStatsYears(allGames);
    if(statsYears.length < 3) {
        stopStatsYearAnimation();
      S.statsYear = 'all';
      S.statsYearError = '';
    }
    if(S.statsYear !== 'all' && !statsYears.includes(Number(S.statsYear))) {
      S.statsYear = 'all';
      S.statsYearError = '';
    }
    const games = S.statsYear === 'all'
      ? allGames
      : allGames.filter(game => gameYear(game) === Number(S.statsYear));
    const orderedGames = games.slice().sort((a,b) => gameKey(a).localeCompare(gameKey(b)));
    const totalGames = games.length;
    const wins = [0, 0];
    const totals = [0, 0];
    const margins = [];
    const hostMargins = [];
    const guestMargins = [];

    games.forEach(g => {
      const winnerIdx = gameWinnerIdx(g);
      const scores = gameScores(g);
      wins[winnerIdx]++;
      totals[0] += scores[0];
      totals[1] += scores[1];
      const diff = Math.abs(scores[0] - scores[1]);
      margins.push(diff);
      if (winnerIdx === 0) hostMargins.push(diff);
      else guestMargins.push(diff);
    });

    const p1Name = escapeHTML(S.names[0]) || 'Host';
    const p2Name = escapeHTML(S.names[1]) || 'Guest';

    const avg = [
      totalGames ? (totals[0] / totalGames).toFixed(1) : '0.0',
      totalGames ? (totals[1] / totalGames).toFixed(1) : '0.0'
    ];

    const box1Titles = ['GAMES WON', 'AVERAGE POINTS PER GAME', 'TOTAL POINTS'];
    const box1Data = [
      [wins[0], wins[1]],
      [avg[0], avg[1]],
      [totals[0], totals[1]]
    ];

    const box2Titles = ['CUMULATIVE GAMES WON', 'CUMULATIVE POINTS'];

    const cumulativeWinsHost = [];
    const cumulativeWinsGuest = [];
    const cumulativePointsHost = [];
    const cumulativePointsGuest = [];
    let runningWinsHost = 0;
    let runningWinsGuest = 0;
    let runningPointsHost = 0;
    let runningPointsGuest = 0;
    orderedGames.forEach(g => {
      const scores = gameScores(g);
      if (gameWinnerIdx(g) === 0) runningWinsHost++;
      else runningWinsGuest++;
      cumulativeWinsHost.push(runningWinsHost);
      cumulativeWinsGuest.push(runningWinsGuest);
      runningPointsHost += scores[0];
      runningPointsGuest += scores[1];
      cumulativePointsHost.push(runningPointsHost);
      cumulativePointsGuest.push(runningPointsGuest);
    });

    const makeLinePath = (points, opts={}) => {
      if (!points.length) return '';
      const width = opts.width || 320;
      const height = opts.height || 70;
      const padding = opts.padding || 16;
      const minVal = Math.min(...points, 0);
      const maxVal = Math.max(...points, 0);
      const range = maxVal - minVal || 1;
      const step = points.length > 1 ? (width - padding * 2) / (points.length - 1) : 0;
      const mapped = points.map((value, index) => {
        const x = padding + step * index;
        const y = height - padding - ((value - minVal) / range) * (height - padding * 2);
        return { x, y };
      });
      if (mapped.length === 1) {
        const point = mapped[0];
        return `M ${point.x} ${point.y} L ${point.x} ${point.y}`;
      }
      return `M ${mapped.map(point => `${point.x} ${point.y}`).join(' L ')}`;
    };

    // Prepare single-line lead series for games or points (host minus guest)
    const gameLeads = cumulativeWinsHost.map((v,i)=> v - (cumulativeWinsGuest[i]||0));
    const pointLeads = cumulativePointsHost.map((v,i)=> v - (cumulativePointsGuest[i]||0));
    const leadSeries = S.statsBox2 === 0 ? gameLeads : pointLeads;
    const leadTitle = ['GAMES', 'POINTS', 'SCORES'][S.statsBox2] || 'GAMES';
    const leadPath = makeLinePath(leadSeries, {width:320,height:70,padding:16});
    const scoreHistory = orderedGames;

    const box3Titles = ['WIN MARGINS', `WIN MARGINS FOR ${p1Name.toUpperCase()}`, `WIN MARGINS FOR ${p2Name.toUpperCase()}`];
    const selectedMargins = S.statsBox3 === 0 ? margins : S.statsBox3 === 1 ? hostMargins : guestMargins;
    const histSvg = (() => {
      const w = 360, h = 80;
      const bins = 8;
      const values = selectedMargins.length ? selectedMargins : [];
      if (!values.length) return '';
      const maxVal = Math.max(...values, 1);
      const counts = new Array(bins).fill(0);
      values.forEach(v => {
        const index = Math.min(Math.floor((v / maxVal) * bins), bins - 1);
        counts[index]++;
      });
      const maxCount = Math.max(...counts, 1);
      return counts.map((c, i) => {
        const barH = (c / maxCount) * h;
        const x = (i / bins) * w + 2;
        const barW = (w / bins) - 4;
        return `<rect x="${x}" y="${h - barH}" width="${barW}" height="${barH}" fill="#1D9E75" opacity="0.65" />`;
      }).join('');
    })();

    content = `
      <div class="stats-grid">
        ${statsYears.length >= 3 ? `<div class="stats-year-filter" aria-label="Filter statistics by year">
          <button type="button" aria-label="Previous year" onclick="moveStatsYear(-1)" ${statsYears.length ? '' : 'disabled'}>&lsaquo;</button>
          <input type="number" aria-label="Statistics year; blank shows all years; double-click to cycle forward" title="Double-click to cycle years forward" placeholder="All" value="${S.statsYear === 'all' ? '' : S.statsYear}" ${statsYears.length ? `min="${statsYears[0]}" max="${statsYears[statsYears.length - 1]}"` : 'disabled'} step="1" inputmode="numeric" onchange="setStatsYear(this.value)" ondblclick="startStatsYearAnimation(event)"/>
          <button type="button" aria-label="Next year" onclick="moveStatsYear(1)" ${statsYears.length ? '' : 'disabled'}>&rsaquo;</button>
        </div>` : ''}
        ${S.statsYearError ? `<div class="stats-year-error" role="status">${escapeHTML(S.statsYearError)}</div>` : ''}
        <div class="stats-box" onclick="S.statsBox1=(S.statsBox1+1)%3;save();render();">
          <div class="stats-box-title">${box1Titles[S.statsBox1]}</div>
          <div class="stats-box-data stats-card-content" style="gap:10px;max-width:180px;margin:0 auto;">
            <div class="stats-box-row" style="justify-content:space-between;">
              <span class="stats-box-num">${box1Data[S.statsBox1][0]}</span>
              <span class="stats-box-label">${p1Name}</span>
            </div>
            <div class="stats-box-row" style="justify-content:space-between;">
              <span class="stats-box-num">${box1Data[S.statsBox1][1]}</span>
              <span class="stats-box-label">${p2Name}</span>
            </div>
          </div>
        </div>
        <div class="stats-box" onclick="S.statsBox2=(S.statsBox2+1)%3;save();render();">
          <div class="stats-box-title">${leadTitle}</div>
          ${S.statsBox2 === 2 ? `
            <div class="stats-recent stats-scores-history" id="stats-scores-history" onclick="event.stopPropagation();">
              <div class="stats-recent-row stats-recent-head">
                <span>Date</span><span>${p1Name}</span><span>${p2Name}</span>
              </div>
              ${scoreHistory.map(game => {
                const norm = normalizeGameDate(game.date || game.time || '');
                const scores = gameScores(game);
                return `<div class="stats-recent-row"><span>${escapeHTML(norm.date)}</span><span>${scores[0]}</span><span>${scores[1]}</span></div>`;
              }).join('')}
            </div>
          ` : `
            <div class="stats-card-content">
              <div class="chart-container" style="margin:0;padding:10px;border:none;">
                <svg viewBox="0 0 360 90" preserveAspectRatio="none" width="100%" height="90">
                  <path d="${leadPath}" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          `}
        </div>
        <div class="stats-box" onclick="S.statsBox3=(S.statsBox3+1)%3;save();render();">
          <div class="stats-box-title">${box3Titles[S.statsBox3]}</div>
          <div class="stats-card-content">
            <div class="chart-container" style="margin:0;padding:10px;border:none;">
              <svg viewBox="0 0 360 80" width="100%" height="80">${histSvg}</svg>
            </div>
          </div>
        </div>
      </div>
    `;
  } else {
    const currentKey = getContestKey(S.names);
    const contestOptions = Object.keys(S.contests).map(k => {
      const isSelected = !S.showNewContestInputs && currentKey === k;
      const displayKey = k.split('|').map(escapeHTML).join(' vs ');
      return `<option value="${escapeHTML(k)}" ${isSelected ? 'selected' : ''}>${displayKey}</option>`;
    }).join('');
    const dataMode = S.optionsDataMode || 'empty';
    const dataConfig = {
      empty: {label:'DATA', placeholder:''},
      import: {label:'DATA', placeholder:''},
      export: {label:'DATA', placeholder:'No scores to export'},
      'cloud-create': {label:'CLOUD SHEET', placeholder:'Choose a hard-to-guess name'},
      'cloud-download': {label:'DOWNLOAD CONTEST', placeholder:'Sheet name'},
      'new-contest': {label:'DATA', placeholder:'Player 1\nPlayer 2'}
    }[dataMode] || {label:'DATA',placeholder:''};
    const darkMode=S.theme==='dark';
    const dataActions = dataMode==='cloud-create'
        ? `<button class="action-btn primary" onclick="createCloudSheet()">${getBackupConfig().sheetName ? 'Enable' : 'Create sheet'}</button><button class="action-btn" onclick="cancelCloudFlow()">Cancel</button>`
        : dataMode==='cloud-download'
          ? `<button class="action-btn primary" onclick="downloadCloudContest()">Download</button><button class="action-btn" onclick="cancelCloudFlow()">Cancel</button>`
        : dataMode==='new-contest'
          ? `<button class="action-btn primary" onclick="createContestFromData()">Add</button><button class="action-btn" onclick="cancelNewContest()">Cancel</button>`
          : dataMode==='import'
            ? `<button class="action-btn primary" onclick="doImport()">Import</button><button class="action-btn" onclick="cancelImport()">Cancel</button>`
          : dataMode==='erase-confirm'
            ? `<button class="action-btn" onclick="cancelClearConfirmation()">Cancel</button><button class="action-btn danger" onclick="performClearScores()">Erase</button>`
          : '';
    const cloudFields = dataMode==='cloud-create'
      ? `<div class="cloud-form-row"><label for="cloud-sheet-name">Sheet</label>
         <input id="cloud-sheet-name" class="cloud-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeHTML(dataConfig.placeholder)}" value="${escapeHTML(S.cloudSheetName || '')}" oninput="S.cloudSheetName=this.value"/></div>
         <div class="cloud-form-row"><label for="cloud-scorekeeper">Scorer</label>
         <input id="cloud-scorekeeper" class="cloud-input" type="text" autocomplete="name" placeholder="Defaults to first player" value="${escapeHTML(S.cloudScorekeeper || '')}" oninput="S.cloudScorekeeper=this.value"/></div>`
      : dataMode==='cloud-download'
        ? `<div class="cloud-form-row"><label for="cloud-sheet-name">Sheet</label>
           <input id="cloud-sheet-name" class="cloud-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeHTML(dataConfig.placeholder)}" value="${escapeHTML(S.cloudSheetName || '')}" oninput="S.cloudSheetName=this.value"/></div>
           <div class="cloud-form-row"><label for="cloud-scorekeeper">Scorer</label>
           <input id="cloud-scorekeeper" class="cloud-input" type="text" autocomplete="name" placeholder="Defaults to first player" value="${escapeHTML(S.cloudScorekeeper || '')}" oninput="S.cloudScorekeeper=this.value"/></div>`
      : dataMode==='new-contest'
        ? `<div class="contest-form-row"><label for="new-player-1">Player 1</label>
           <input id="new-player-1" class="cloud-input" type="text" autocomplete="name" value="${escapeHTML((S.newNames && S.newNames[0]) || '')}" oninput="S.newNames[0]=this.value"/></div>
           <div class="contest-form-row"><label for="new-player-2">Player 2</label>
           <input id="new-player-2" class="cloud-input" type="text" autocomplete="name" value="${escapeHTML((S.newNames && S.newNames[1]) || '')}" oninput="S.newNames[1]=this.value"/></div>`
        : '';
    const showDataTextarea = dataMode==='import' || dataMode==='export';
    const eraseFields = dataMode==='erase-confirm'
      ? `<div class="erase-confirm-copy">Erase local data for ${escapeHTML(S.clearConfirm.names[0] || 'Player 1')} vs ${escapeHTML(S.clearConfirm.names[1] || 'Player 2')}?<br/>The server copy remains.</div>`
      : '';
    content = `
      <section class="opt-section parameters">
        <div class="opt-label opt-heading parameter-header">
          <span class="parameter-title">PARAMETERS</span>
        </div>
        <div class="parameter-row">
          <label for="player-select">Players</label>
          <select id="player-select" class="player-select" aria-label="Players" onchange="handleContestChange(this.value)">
            <option value="__NEW__" ${S.showNewContestInputs ? 'selected' : ''}>New...</option>
            <option value="__DOWNLOAD__">Download...</option>
            ${contestOptions}
          </select>
        </div>
        <div class="parameter-row option-row">
          <span>Options</span>
          <div class="option-pills">
            <label class="option-pill"><input id="cloud-enabled" type="checkbox" ${S.backupEnabled?'checked':''} onchange="setBackupEnabled(this.checked)"/>Cloud</label>
            <label class="option-pill"><input id="dark-enabled" type="checkbox" ${darkMode?'checked':''} onchange="toggleDarkMode(this.checked)"/>Dark</label>
            <label class="option-pill top-score-pill">
              <span>Max</span>
              <input id="target-score" type="number" value="${S.target}" min="25" max="500" step="25" onchange="S.target=Math.max(25,parseInt(this.value)||50);save();setStatus('Max score updated.',0);" inputmode="numeric"/>
            </label>
          </div>
        </div>
        <div class="parameter-row score-row">
          <span>Scores</span>
          <div class="data-action-row">
            <button class="action-btn ${dataMode==='import'?'primary':''}" onclick="${dataMode==='import'?'doImport()':'openImport()'}">${dataMode==='import'?'Import':'Import'}</button>
            <button class="action-btn" onclick="copyExport()">Export</button>
            <button class="action-btn danger" onclick="clearScores()">Erase</button>
          </div>
        </div>
      </section>

      <section class="opt-section data-panel">
        ${eraseFields || cloudFields || (showDataTextarea ? `
          <label class="opt-label" for="options-data">${escapeHTML(dataConfig.label)}</label>
          <textarea id="options-data" class="export-area" placeholder="${escapeHTML(dataConfig.placeholder)}" ${dataMode==='export'?'readonly':''} oninput="S.optionsDataText=this.value;save()">${escapeHTML(S.optionsDataText || '')}</textarea>
        ` : '')}
        ${dataActions ? `<div class="data-actions">${dataActions}</div>` : ''}
      </section>
    `;
  }

  const showStatusBarBottom = S.tab !== 0 && S.tab !== 1;
  const clearConfirm = S.tab === 2 && S.clearConfirm;
  const statusHtml = S.tab === 2 ? `
    <div class="status-bar option-status" onclick="event.stopPropagation();" ondblclick="showVersionStamp()">
      <div class="status-text ${S.status || activeHelpMessage?'':'empty'}">
        ${escapeHTML(S.status || activeHelpMessage || '').replace(/\n/g,'<br/>')}
      </div>
      <div class="status-icon" onclick="${statusClick}; event.stopPropagation();" aria-label="${statusIcon==='?'?'Show help':'Dismiss status'}">${statusIcon}</div>
    </div>
  ` : (!showStatusBarBottom ? '' : `<div class="status-bar" onclick="${statusClick}"><div class="status-text ${statusText?'':'empty'}">${statusText||' '}</div><div class="status-icon">${statusIcon}</div></div>`);
  appEl.innerHTML = `<div class="tab-content">${content}${statusHtml}</div><div class="tabbar">${tabbar}</div>`;
  const scoresHistory = appEl.querySelector('.stats-scores-history');
  if(scoresHistory) {
    scoresHistory.scrollTop = existingScoresHistoryScrollTop === null
      ? scoresHistory.scrollHeight
      : existingScoresHistoryScrollTop;
  }
  
  if (S.tab === 0 && showHistory) {
    patchMiniHistory(historyEntries);
  }
  if(activeId) {
    const el = document.getElementById(activeId);
    if(el) {
      el.focus();
      if(el.tagName === 'INPUT' && el.type === 'text') {
        const val = el.value;
        el.value = '';
        el.value = val;
      }
    }
  }
}

load();
if(S.backupEnabled) syncActiveContest();
document.addEventListener('keydown', event => {
  const target = event.target;
  const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA';
  if(isInput) return;
  if(S.tab === 1 && S.statsBox2 === 2 && (event.key === 'j' || event.key === 'k') &&
      !event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) {
    const scoresHistory = document.getElementById('stats-scores-history');
    if(scoresHistory) {
      event.preventDefault();
      scoresHistory.scrollBy({top:event.key === 'j' ? 80 : -80, behavior:'smooth'});
      return;
    }
  }
  if(event.key === '?' && S.tab === 0 && !event.metaKey && !event.ctrlKey && !event.altKey) {
    event.preventDefault();
    showHelp();
    return;
  }
  if(event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
  
  if(event.key === 'g' || event.key === 'G') { event.preventDefault(); setTab(0); }
  else if(event.key === 's' || event.key === 'S') { event.preventDefault(); setTab(1); }
  else if(event.key === 'o' || event.key === 'O') { event.preventDefault(); setTab(2); }
});
document.addEventListener('click', event => {
  if(Date.now() - LAST_STATUS_SET < 150) return;
  if(!S.status) return;
  if(event.target.closest('.status-bar')) return;
  clearStatus();
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    // updateViaCache:'none' stops Safari from serving a stale sw.js from HTTP cache during update checks.
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => {
      return reg.update();
    }).catch(() => {});
  });
  // Reload once when a new service worker takes control, so users get the fresh app shell.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    location.reload();
  });
}

render();
</script>
</body>
</html>
