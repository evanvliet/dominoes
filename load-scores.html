*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{

}
html,body{height:100%;background:var(--color-background-tertiary);font-family:var(--font-sans);}
.app{max-width:430px;margin:0 auto;padding:16px;}
h1{font-size:20px;color:var(--color-text-primary);margin-bottom:10px;}
p{font-size:14px;color:var(--color-text-secondary);margin-bottom:12px;line-height:1.4;}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px;margin-bottom:12px;}
textarea#score-data{width:100%;height:200px;font-size:12px;font-family:monospace;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px;background:var(--color-background-secondary);color:var(--color-text-primary);resize:vertical;}
.action-btn{display:block;width:100%;background:#1D9E75;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:16px;font-weight:500;padding:12px;margin-top:10px;cursor:pointer;}
.action-btn:active{opacity:0.85;}
.status{font-size:13px;margin-top:10px;min-height:18px;color:var(--color-text-secondary);}
.status.ok{color:#1D9E75;}
.status.err{color:#e0463f;}
a.open-link{display:block;text-align:center;margin-top:14px;font-size:14px;color:#1D9E75;}
</style>

    <button class="action-btn" onclick="loadScoreData()">Load Score Data</button>
    <div id="status" class="status"></div>
  </div>
  <a class="open-link" href="index.html">Open Dominoes App</a>
</div>
<script>
const SK='dom_v9';

function getContestKey(names){
  return [...names].sort().map(n=>n.trim()).join('|');
}

function setStatus(msg, ok){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className='status '+(ok?'ok':'err');
}

function loadScoreData(){
  const text=document.getElementById('score-data').value;
  if(!text.trim()){ setStatus('No data to load.', false); return; }
  try{
    const lines=text.trim().split('\n');
    const names=lines[0].split('|').map(n=>n.trim());
    if(names.length!==2 || !names[0] || !names[1]){
      setStatus('Invalid first line: must be "Player 1 | Player 2"', false);
      return;
    }
    const games=[];
    for(let i=1;i<lines.length;i++){
      const parts=lines[i].trim().split(/\s+/);
      if(parts.length<3) continue;
      let s1,s2,time;
      if(parts.length>=4 && parts[1].includes(':')){
        time=parts[0]+' '+parts[1];
        s1=parseInt(parts[2]);
        s2=parseInt(parts[3]);
      }else{
        time=parts[0];
        s1=parseInt(parts[1]);
        s2=parseInt(parts[2]);
      }
      if(isNaN(s1)||isNaN(s2)) continue;
      games.push({time, names, scores:[s1,s2], winnerIdx: s1>=s2?0:1});
    }
    if(games.length===0){ setStatus('No valid game rows found.', false); return; }

    const raw=localStorage.getItem(SK);
    const S = raw ? JSON.parse(raw) : {};
    if(!S.contests) S.contests={};

    const key=getContestKey(names);
    const existing=S.contests[key];
    const pastGames = existing ? [...games, ...existing.pastGames] : games;
    const last = pastGames[0];

    S.contests[key]={
      names:[...names],
      scores: existing ? existing.scores : [0,0],
      handScores: existing ? existing.handScores : [0,0],
      records: existing ? existing.records : [],
      pastGames,
      target: existing ? existing.target : 50,
      gameOver: existing ? existing.gameOver : false,
      phase: existing ? existing.phase : 'start',
      firstPlayer: existing ? existing.firstPlayer : -1,
      handFirstPlayer: existing ? existing.handFirstPlayer : -1,
      handNum: existing ? existing.handNum : 0,
      lastAdded: existing ? existing.lastAdded : ['',''],
      pendingWin: existing ? existing.pendingWin : false,
      starterSelection: existing ? existing.starterSelection : true,
      highestDoublePlayer: existing ? existing.highestDoublePlayer : -1,
      theme: existing ? existing.theme : (S.theme || 'system')
    };

    // make this the active contest so the app opens directly into it
    S.names=[...names];
    S.scores=S.contests[key].scores;
    S.handScores=S.contests[key].handScores;
    S.records=S.contests[key].records;
    S.pastGames=S.contests[key].pastGames;
    S.target=S.contests[key].target;
    S.gameOver=S.contests[key].gameOver;
    S.phase=S.contests[key].phase;
    S.firstPlayer=S.contests[key].firstPlayer;
    S.handFirstPlayer=S.contests[key].handFirstPlayer;
    S.handNum=S.contests[key].handNum;
    S.lastAdded=S.contests[key].lastAdded;
    S.pendingWin=S.contests[key].pendingWin;
    S.starterSelection=S.contests[key].starterSelection;
    S.highestDoublePlayer=S.contests[key].highestDoublePlayer;
    S.tab=0;
    S.showNewContestInputs=false;

    localStorage.setItem(SK, JSON.stringify(S));
    setStatus(`Loaded ${games.length} game(s) for ${names[0]} vs ${names[1]}.`, true);
  }catch(err){
    setStatus('Could not parse data — check the format and try again.', false);
  }
}
</script>
